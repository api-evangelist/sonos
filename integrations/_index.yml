# Sonos integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in sonos-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: sonos-apple-mfi-program-licensed-accessories
  label: Apple MFi Program (licensed accessories)
  partner: apple
  partner_name: Apple MFi Program (licensed accessories)
  category: Apple accessory licensing
  type: register
  channel: standard-directory
  evidence: https://mfi.apple.com/en/account/accessory-search
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Apple MFi licensed accessory search (mfi.apple.com/account/accessory-search)
    standard: Apple MFi Program
    spec_file: null
    role: mfi-licensed-accessory-brand
    registered_name: SONOS
    register_id: https://mfi.apple.com/en/account/accessory-search
    matched_domain: null
    matched_by: register-name
    register_name_note: register-name 'sonos' = sonos; wikidata P856 sonos.com agrees or unheld
    certified_products:
    - product: AirPlay audio
      lapsed: false
      accessories_listed: 66
    - product: Wireless Accessory Configuration
      lapsed: false
      accessories_listed: 66
    products_sample:
    - Sonos Amp
    - Sonos Arc
    - Sonos Five
    - Sonos Move
    - Sonos One
    - Sonos One SL
    signal_note: certified_products = one entry per MFi technology group the brand holds a licensed accessory in,
      never per accessory, model or UPC (context only). The search lists current licences and marks none withdrawn,
      so lapsed is false
    detected_by: sweep-apple-mfi-ecosystem.py
    detected: '2026-10-21'
    other_registrations:
    - Sonos
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
