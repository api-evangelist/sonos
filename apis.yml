aid: sonos
name: Sonos
description: >-
  Sonos is a consumer audio company whose wireless home-sound systems are
  controlled programmatically through the Sonos Control API — a cloud-based
  REST API that lets third-party integrations discover a household's players
  and groups and drive playback, volume, grouping, favorites, playlists, home
  theater options, audio clips, and cloud-queue sessions. The API authenticates
  with OAuth 2.0 (authorization code grant) using the single
  playback-control-all scope, is organized into per-resource namespaces
  (households, groups, groupVolume, playback, playbackMetadata, playbackSession,
  playerVolume, favorites, playlists, audioClip, homeTheater), and delivers
  real-time state through an event-subscription (webhook callback) model.
